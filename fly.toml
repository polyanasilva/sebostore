# fly.toml app configuration file generated for forra-cultural on 2026-06-21T17:46:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'forra-cultural'
primary_region = 'gru'

[build]

[env]
  FLASK_DEBUG = '0'
  PORT = '8080'
  SEBO_DB_PATH = '/data/sebo_store.db'
  SEBO_UPLOAD_DIR = '/data/uploads'

[[mounts]]
  source = 'sebo_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
